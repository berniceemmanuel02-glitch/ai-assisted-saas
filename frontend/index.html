<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholapay - School Fee Management</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <div id="sidebar" class="sidebar" style="display: none;">
      <div class="sidebar-brand">
        <div class="sidebar-logo">SP</div>
        <div class="sidebar-title">Scholapay</div>
      </div>
      <nav class="sidebar-nav">
        <a href="#dashboard" class="sidebar-link active" data-section="dashboard">
          <span class="sidebar-icon">&#128202;</span>
          <span>Dashboard</span>
        </a>
        <a href="#students" class="sidebar-link" data-section="students">
          <span class="sidebar-icon">&#127891;</span>
          <span>Students</span>
        </a>
        <a href="#fees" class="sidebar-link" data-section="fees">
          <span class="sidebar-icon">&#128176;</span>
          <span>Fee Structures</span>
        </a>
        <a href="#parent-login" class="sidebar-link" data-section="parent-login" onclick="showParentLogin()">
          <span class="sidebar-icon">&#128106;</span>
          <span>👨‍👩‍👧 Parent Portal</span>
        </a>
        <a href="#payments" class="sidebar-link" data-section="payments">
          <span class="sidebar-icon">&#128179;</span>
          <span>Payments</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn" class="btn btn-small btn-outline" style="width:100%; justify-content:center;">Logout</button>
      </div>
    </div>
    <div class="main-wrapper">
      <header id="header" class="header" style="display: none;">
        <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Menu">&#9776;</button>
        <div class="header-school-info">
          <span id="header-school-name" class="header-school-name"></span>
          <span id="header-school-id" class="header-school-id"></span>
        </div>
        <div class="header-user-info">
          <span id="header-user-name" class="header-user-name"></span>
        </div>
      </header>
      <main id="main-content" class="main-content"></main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/parent-auth.js"></script>
  <script src="js/parent-dashboard.js"></script>
  <script src="js/parents.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/students.js"></script>
  <script src="js/fees.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/receipts.js"></script>
</body>
</html>
